services:
  - type: worker
    name: taskverse-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: taskverse
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
